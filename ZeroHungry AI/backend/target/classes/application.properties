# ═══════════════════════════════════════════════════════════════════
#  ZeroHungry AI — application.properties
#
#  Spring Boot reads this file AUTOMATICALLY when the app starts.
#  Every line is a key=value pair that configures one behaviour.
#
#  Think of this file as the "settings panel" of your application.
#  You change values here instead of changing Java code.
# ═══════════════════════════════════════════════════════════════════


# ── 1. SERVER ────────────────────────────────────────────────────────
# The network port the backend will listen on.
# 8080 is the standard Spring Boot development port.
# All APIs are available at: http://localhost:8080
server.port=8080

# The application name — appears in log messages so you can identify
# which app produced a log line when running multiple services.
spring.application.name=zerohungry-ai


# ── 2. DATASOURCE (MySQL connection) ─────────────────────────────────
#
# spring.datasource.url
# ─────────────────────
# The JDBC URL tells Spring Boot WHERE to find the database.
# Format:  jdbc:mysql://HOST:PORT/DATABASE_NAME
#
#   jdbc          = the protocol (Java Database Connectivity)
#   mysql         = the database type
#   localhost     = the database is on THIS computer
#   3306          = MySQL's default port number
#   zerohungry_ai = the name of the database (schema) to use
#                   You must create this database in MySQL first:
#                   CREATE DATABASE zerohungry_ai;
#
spring.datasource.url=jdbc:mysql://localhost:3306/zerohungry_ai

# The MySQL username Spring Boot will use to log in.
# "root" is the default administrator account in MySQL.
spring.datasource.username=root

# ⚠️  IMPORTANT — Replace YOUR_MYSQL_PASSWORD below with the password
# you set for the MySQL root account during MySQL installation.
# Example: if your password is Admin@1234, write:
#          spring.datasource.password=Admin@1234
# If you installed MySQL with NO password, leave the value blank:
#          spring.datasource.password=
spring.datasource.password=durga@2504

# The fully qualified class name of the MySQL JDBC Driver.
# This tells JDBC which driver class to load at startup.
# mysql-connector-j provides this class automatically.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ── 3. JPA / HIBERNATE ───────────────────────────────────────────────
#
# spring.jpa.hibernate.ddl-auto
# ─────────────────────────────
# Controls what Hibernate does to the database schema on startup.
#
# Possible values:
#   none        → do nothing (manual schema management)
#   validate    → check that the DB matches your entities; error if not
#   update      → add missing columns/tables; never drop anything ✅
#   create      → drop and recreate all tables every time (lose all data!)
#   create-drop → create on start, drop on shutdown
#
# "update" is safe for development:
#   • First run  → creates the tables automatically
#   • Later runs → only adds new columns; existing data is kept
#
spring.jpa.hibernate.ddl-auto=update

# Print every SQL statement Hibernate sends to MySQL in the terminal.
# Very useful for learning and debugging.
# Set to false in production to avoid cluttered logs.
spring.jpa.show-sql=true

# Format the printed SQL so it is easier to read (adds line breaks).
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate which SQL dialect (grammar) to use.
# NOTE: In Spring Boot 3.x / Hibernate 6.x, dialect is detected
# automatically from the JDBC driver — do NOT set it manually.
# Setting it explicitly causes a deprecation warning in Hibernate 6.
# The line below is intentionally commented out:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# ── 4. LOGGING ───────────────────────────────────────────────────────
# INFO  = normal messages  (recommended while developing)
# DEBUG = very detailed    (useful when troubleshooting)
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG


